apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-project
  template:
    metadata:
      labels:
        app: the-project
    spec:
      volumes:
      - name: shared-volume
        persistentVolumeClaim:
            claimName: shared-claim
      containers:
      - image: the_project
        imagePullPolicy: Never
        name: the-project
        volumeMounts: # Mount volume
          - name: shared-volume
            mountPath: /usr/src/app/files
        env:
        - name: PORT
          value: "3000"
        - name: IMAGE_PATH
          value: "/usr/src/app/files/image.jpg"
      - image: backend
        imagePullPolicy: Never
        name: backend
        env:
        - name: PORT
          value: "8080"