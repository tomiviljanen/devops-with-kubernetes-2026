apiVersion: v1
kind: Service
metadata:
  name: the-project-svc
  namespace: project
spec:
  type: ClusterIP
  selector:
    app: the-project # This is the app as declared in the deployment.
  ports:
    - port: 2345
      protocol: TCP
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: project
spec:
  selector:
    app: the-project
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080