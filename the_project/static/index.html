<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello world</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 20px;
        }

        #input {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        #todo-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #todo-item {
            width: 100%;
            border: 1px solid black;
            padding: 10px;
            border-left: 3px solid green;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1 style="text-align: center;">TODO APP</h1>
    <img src="/image.jpg" alt="random image from picsum" />
    <div id="input"> 
        <input style="flex-grow: 1" type="text" placeholder="Enter a new todo (max 140 characters)">
        <button>Send</button>
    </div>

    <div id="todo-container">
        <div id="todo-item">
            Learn kubernetes basics
        </div>
        <div id="todo-item">
            Deploy application to cluster
        </div>
        <div id="todo-item">
            Configure Persistent volumes
        </div>
    </div>
</body>

</html>
