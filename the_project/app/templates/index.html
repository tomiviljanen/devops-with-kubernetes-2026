<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello world</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 20px;
        }

        #input {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        #input-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        #todo-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #todo-item {
            width: 100%;
            border: 1px solid black;
            padding: 10px;
            border-left: 3px solid green;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <script>
        function sendTodo() {
            const input = document.querySelector('#todo-input');
            const text = input.value;
            const PORT = "{{ .Port }}";

            if (text) {
                fetch('/todo', {
                    method: 'POST',
                    body: text
                }).then(() => {
                    input.value = '';
                    location.reload();
                }).catch(err => {
                    console.error(err);
                });
            }
        }
    </script>
    <h1 style="text-align: center;">TODO APP</h1>
    <img src="static/image.jpg" alt="random image from picsum" />
    <div id="input-container">
        <input id="todo-input" style="flex-grow: 1" type="text" name="todo"
            placeholder="Enter a new todo (max 140 characters)">
        <button onclick="sendTodo()">Send</button>
    </div>

    <div id="todo-container">
        {{range .Todos}}
        <div id="todo-item">
            {{.}}
        </div>
        {{end}}
    </div>
</body>

</html>
