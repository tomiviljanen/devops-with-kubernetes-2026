apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
      - image: europe-west1-docker.pkg.dev/dwk-gke-514813/pingpong/pingpong:latest
        name: pingpong
        imagePullPolicy: Always
        env:
        - name: PORT
          value: "3000"
