#        volumeMounts: # Mount volume
#          - name: shared-volume
#            mountPath: /usr/src/app/files
#        env:
#        - name: OUTPUT_DIR
#          value: "/usr/src/app/files/"
      - image: randomhash-server
        imagePullPolicy: Never
        name: randomhash-server
        env:
        - name: PORT
          value: "3000"
        - name: COUNT_URL
          value: "http://pingpong-svc:2345/count"