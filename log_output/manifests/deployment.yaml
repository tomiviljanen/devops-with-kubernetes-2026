apiVersion: apps/v1
kind: Deployment
metadata:
  name: randomhash
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: randomhash
  template:
    metadata:
      labels:
        app: randomhash
    spec:
      volumes:
      - name: messages
        configMap:
          name: log-output-configmap
      containers:
#      - image: randomhash
#        imagePullPolicy: Never
#        name: randomhash
#        volumeMounts: # Mount volume
#          - name: shared-volume
#            mountPath: /usr/src/app/files
#        env:
#        - name: OUTPUT_DIR
#          value: "/usr/src/app/files/"
      - image: randomhash-server
        imagePullPolicy: Never
        name: randomhash-server
        volumeMounts:
          - name: messages
            mountPath: /usr/src/app/files
        env:
        - name: MOUNT_PATH
          value: "/usr/src/app/files/"
        - name: PORT
          value: "3000"
        - name: COUNT_URL
          value: "http://pingpong-svc:2345/count"
        - name: MESSAGE
          valueFrom:
            configMapKeyRef:
              name: log-output-configmap
              key: MESSAGE